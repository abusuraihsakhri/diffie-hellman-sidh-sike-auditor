name: Publish static threshold demo
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and JavaScript over HTTPS
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/auditor-live.html
          curl --fail --location --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "${PAGE_URL%/}/audit.js" -o /tmp/auditor-live.js
          grep -Fq 'id="audit-form"' /tmp/auditor-live.html
          grep -Fq 'function evaluateAudit' /tmp/auditor-live.js
