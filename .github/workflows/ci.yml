name: Diffie Hellman Sidh Sike Auditor CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[api,test]'

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Audit integrity smoke test
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "

    - name: Python syntax and dependency verification
      run: |
        python -m compileall -q agents isogeny_auditor cli.py enrichment.py simulator.py
        python -m pip check

    - name: Set up Node.js for static UI tests
      uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Static UI tests
      run: |
        node --check web/audit.js
        node --test web/audit.test.cjs
