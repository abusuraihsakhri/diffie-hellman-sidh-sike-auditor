version: '3.8'

services:
  diffie-hellman-sidh-sike-auditor:
    build: .
    container_name: diffie-hellman-sidh-sike-auditor
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=diffie-hellman-sidh-sike-auditor-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
