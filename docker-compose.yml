services:
  diffie-hellman-sidh-sike-auditor:
    build: .
    container_name: diffie-hellman-sidh-sike-auditor
    ports:
      - "127.0.0.1:${AUDITOR_PORT:-8000}:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:?Set a new random AUDIT_SECRET_KEY in your environment}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
