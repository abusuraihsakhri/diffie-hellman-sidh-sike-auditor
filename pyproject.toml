[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffie-hellman-sidh-sike-auditor"
version = "2.0.0"
description = "Isogeny Cryptanalysis & SIDH/SIKE Vulnerability Auditor Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
diffie-hellman-sidh-sike-auditor = "isogeny_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/diffie-hellman-sidh-sike-auditor"
Repository = "https://github.com/abusuraihsakhri/diffie-hellman-sidh-sike-auditor.git"

[tool.setuptools]
packages = ["agents", "isogeny_auditor"]
py-modules = ["cli", "enrichment", "simulator", "isogeny_auditor_app"]
